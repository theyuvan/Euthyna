# Render's free plan puts the backend to sleep after ~15 minutes without traffic, which pauses the
# agent, settler and indexer loops. This pings it every 10 minutes so the loops keep running.
# (GitHub may start scheduled runs a few minutes late; that's fine for a 15-minute idle window.)
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://euthyna-np2i.onrender.com/health
          curl -fsS --max-time 60 https://euthyna-np2i.onrender.com/api/stats > /dev/null
